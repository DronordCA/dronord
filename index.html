<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dronord</title>
  <style>
    /* Reset minimal */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #fff;
      color: #111;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      text-align: center;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: white;
      padding: 20px 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 100;
    }

    header img {
      width: 200px;
      height: auto;
      display: block;
      margin: 0 auto 10px;
      transition: transform 0.5s, opacity 0.5s;
      opacity: 0;
      transform: translateY(-20px);
      animation: fadeInDown 0.5s forwards;
    }

    @keyframes fadeInDown {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    nav a {
      text-decoration: none;
      color: #555;
      font-weight: 500;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #000;
    }

    main {
      margin-top: 180px; /* pour laisser l’espace du header */
      padding: 20px;
      flex: 1;
    }

    main h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }

    main p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: 0 auto;
      color: #666;
    }

    footer {
      padding: 20px;
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <img src="dronord_logo_transparent.png" alt="Logo Dronord">
    <nav>
      <a href="#home">Accueil</a>
      <a href="#about">À propos</a>
      <a href="#services">Prestations</a>
      <a href="#gallery">Galerie</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <main id="home">
    <h1>Dronord — Capturons le Nord autrement</h1>
    <p>
      Spécialisé dans la photographie et la vidéographie aérienne, Dronord propose des images immersives et naturelles au cœur du Québec.
    </p>
  </main>

  <!-- Footer -->
  <footer>
    © 2025 Dronord — Tous droits réservés
  </footer>

</body>
</html>
